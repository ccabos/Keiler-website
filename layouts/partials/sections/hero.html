<section class="hero">
  {{ with site.Params.heroImage }}
    <img class="hero-bild hat-bild" src="{{ . | relURL }}"
         alt="{{ with site.Params.heroAlt }}{{ . }}{{ else }}Mannschaftsfoto der UHC Keiler{{ end }}"
         loading="eager" fetchpriority="high">
  {{ else }}
    {{/* Bis das Mannschaftsfoto da ist: ruhige Fläche statt kaputtes Bild. */}}
    <div class="hero-bild hero-platzhalter" role="img" aria-label="Platz für das Mannschaftsfoto"></div>
  {{ end }}
  <div class="hero-text">
    <div class="wrap">
      <h1>{{ site.Title }}</h1>
      <p class="claim">{{ site.Params.claim }}</p>
    </div>
  </div>
</section>
